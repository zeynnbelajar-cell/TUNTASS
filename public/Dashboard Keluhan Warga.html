<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Dashboard Keluhan Warga</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif&display=swap">
<style>
/* Layout: kaca asap ala visionOS di atas ruangan buram. Sidebar kiri, panel utama besar, tiga widget melayang di kanan. */
:root{
  --ink:#f6f0e7;
  --ink-2:rgba(246,240,231,.76);
  --ink-3:rgba(246,240,231,.62);
  --glass:rgba(34,26,20,.74);
  --fill-1:rgba(255,248,238,.06);
  --fill-2:rgba(255,248,238,.11);
  --line:rgba(255,248,238,.13);
  --line-2:rgba(255,248,238,.24);
  --blue:#338ced;
  --amber:#d28e05;
  --pink:#e24d8b;
  --green:#0aac23;
  --orange:#e76624;
  --red:#eb6263;
  --btn-a:#336fdc;
  --btn-b:#2056c8;
  --font-display:'Instrument Serif','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:#2b2119;color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid #8cc0ff;outline-offset:2px}
.ic{flex:none}

/* Latar ruangan buram */
.scene{position:fixed;inset:0;z-index:0;overflow:hidden;background:
  radial-gradient(55% 45% at 16% 14%,#d3c5ae 0%,transparent 70%),
  radial-gradient(38% 42% at 84% 26%,#9db4cf 0%,transparent 72%),
  radial-gradient(46% 34% at 50% 56%,#2a2420 0%,transparent 75%),
  radial-gradient(70% 34% at 50% 104%,#94603a 0%,transparent 70%),
  radial-gradient(16% 24% at 6% 80%,#6c7d52 0%,transparent 72%),
  linear-gradient(180deg,#bcae9a 0%,#917d66 55%,#4a3626 100%)}
.scene::before{content:"";position:absolute;left:12%;right:12%;bottom:5%;height:11%;border-radius:999px;background:linear-gradient(180deg,#9b6a42,#5e3e25);filter:blur(10px);opacity:.9}
.scene::after{content:"";position:absolute;right:7%;top:12%;width:2.2%;height:70%;border-radius:8px;background:linear-gradient(90deg,#8a6a47,#5a412a);filter:blur(8px);opacity:.7}

/* Kaca */
.glass{background:linear-gradient(180deg,rgba(255,248,238,.08),rgba(255,248,238,0) 28%),var(--glass);-webkit-backdrop-filter:blur(30px) saturate(1.25);backdrop-filter:blur(30px) saturate(1.25);border:1px solid var(--line);border-radius:28px;box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 30px 60px -24px rgba(0,0,0,.55)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(34,26,20,.94)}}

.stage{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:240px minmax(0,1fr) 312px;gap:16px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1720px;margin:0 auto}

/* Sidebar */
.side{display:flex;flex-direction:column;padding:18px 12px 14px;min-height:0}
.brand{display:flex;gap:10px;align-items:center;padding:2px 8px 18px}
.brand b{display:block;font-weight:600;font-size:14px;line-height:1.25}
.brand small{display:block;color:var(--ink-3);font-size:12px}
.av{display:inline-grid;place-items:center;border-radius:50%;flex:none;font-weight:600;color:#fff;background:linear-gradient(140deg,hsl(var(--h) 52% 46%),hsl(calc(var(--h) + 28) 48% 30%));border:1px solid rgba(255,255,255,.2)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:14px;background:transparent;color:var(--ink-2);font-weight:500;cursor:pointer;text-align:left;transition:background .2s,color .2s}
.nav button:hover{background:var(--fill-1);color:var(--ink)}
.nav button[aria-current=page]{background:var(--fill-2);color:var(--ink)}
.nav .bdg{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--btn-a);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center}
.side-foot{margin-top:auto;padding:12px;border-radius:16px;background:var(--fill-1);border:1px solid var(--line);color:var(--ink-2);font-size:12px;line-height:1.45}
.side-foot b{color:var(--ink);font-weight:600}

/* Panel utama */
.main{display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:24px 26px 14px}
.mhead h1{font-family:var(--font-display);font-weight:400;font-size:38px;line-height:1.02;letter-spacing:-.01em;text-wrap:balance}
.mhead p{margin-top:6px;color:var(--ink-2);font-size:13px}
.pill-btn{flex:none;display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border:0;border-radius:999px;background:linear-gradient(180deg,var(--btn-a),var(--btn-b));color:#fff;font-weight:600;font-size:13px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 20px -8px rgba(47,116,238,.85);transition:transform .2s,filter .2s}
.pill-btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.pill-btn.sm{padding:8px 14px}
.pill-btn.ghost{background:var(--fill-2);box-shadow:inset 0 0 0 1px var(--line-2)}
.pill-btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.mainbody{flex:1;min-height:0;container-name:main;container-type:inline-size;display:flex;flex-direction:column}
.view{flex:1;min-height:0;overflow:auto;padding:4px 26px 26px;scrollbar-width:thin;scrollbar-color:rgba(255,248,238,.25) transparent}
.homebar{display:flex;justify-content:center;align-items:center;gap:8px;padding:0 0 10px}
.homebar i{display:block;width:6px;height:6px;border-radius:50%;background:rgba(255,248,238,.5)}
.homebar b{display:block;width:120px;height:5px;border-radius:5px;background:rgba(255,248,238,.4)}

/* Tipografi umum */
.sec{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.sec .tag{margin-left:auto}
.tag{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;background:var(--fill-2);color:var(--ink-2);font-size:11px;font-weight:500;letter-spacing:0;text-transform:none;white-space:nowrap}
.num{font-family:var(--font-display);font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.code{font-variant-numeric:tabular-nums;color:var(--ink-3);font-weight:500;font-size:12px}
.muted{color:var(--ink-2)}
.card{background:var(--fill-1);border:1px solid var(--line);border-radius:20px;padding:16px}
.stack{display:flex;flex-direction:column;gap:22px}

/* Pill status dan prioritas */
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;background:var(--fill-2);font-size:12px;font-weight:500;white-space:nowrap;color:var(--ink)}
.pill svg{color:var(--sc,var(--ink-2))}
.st-belum{--sc:var(--amber)}.st-diambil{--sc:var(--blue)}.st-dikerjakan{--sc:var(--pink)}.st-selesai{--sc:var(--green)}
.age{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.age.sev-mid{color:#f0c260}.age.sev-hi{color:#ff9a9a;font-weight:600}
.lvl{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--ink);white-space:nowrap}
.lvl svg{color:var(--lc,var(--ink-2))}
.lv-kritis{--lc:var(--red)}.lv-tinggi{--lc:var(--orange)}

/* Widget kanan */
.rail{display:flex;flex-direction:column;gap:14px;min-height:0;min-width:0;overflow:auto;scrollbar-width:none;padding:2px 0}
.w{border-radius:28px;padding:18px;position:relative;border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 24px 48px -26px rgba(0,0,0,.6);transition:transform .25s ease}
.w:hover{transform:translateY(-4px)}
.w h3{font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px}
.w h3 .ic{opacity:.8}
.w .gl{margin-left:auto;opacity:.7}
.w .big{font-family:var(--font-display);font-size:42px;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
.w .sub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;margin-top:2px}
.w-blue{background:radial-gradient(120% 80% at 20% 0%,rgba(255,255,255,.22),transparent 60%),linear-gradient(165deg,#5f86c4,#3a5fa6 55%,#2e4a88);color:#fff}
.w-blue .sub{color:rgba(255,255,255,.88)}
.w-blue .chip{background:rgba(255,255,255,.2);color:#fff}
.w-sand{background:linear-gradient(180deg,rgba(255,248,238,.1),rgba(255,248,238,0) 40%),rgba(70,52,36,.78);-webkit-backdrop-filter:blur(26px) saturate(1.2);backdrop-filter:blur(26px) saturate(1.2)}
.w-sand .big{font-size:34px}
.w-sand .sub{color:var(--ink-2)}
.w-dark{background:linear-gradient(180deg,rgba(255,248,238,.06),rgba(255,248,238,0) 30%),rgba(30,23,18,.8);-webkit-backdrop-filter:blur(26px) saturate(1.2);backdrop-filter:blur(26px) saturate(1.2)}
.w-dark .sub{color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;background:var(--fill-2);font-size:11px;font-weight:500}
.round-btn{position:absolute;right:16px;bottom:16px;width:40px;height:40px;border-radius:50%;border:0;background:#f6f0e7;color:#241b14;display:grid;place-items:center;cursor:pointer;transition:transform .2s}
.round-btn:hover{transform:scale(1.07)}
.chart{display:block;width:100%;height:auto;margin-top:12px;overflow:visible}
.chart text{font-family:var(--font-body)}
.bg .bar{opacity:.88;transition:opacity .15s}
.bg:hover .bar,.bg:focus .bar{opacity:1}
.bg:focus{outline:none}

/* Ringkasan */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile .lab{font-size:12.5px;color:var(--ink-2)}
.tile .val{font-family:var(--font-display);font-size:44px;line-height:1.05;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .nt{font-size:12px;color:var(--ink-2);margin-top:2px}
.seg{display:flex;gap:2px;height:14px;border-radius:7px;overflow:hidden}
.seg i{display:block;min-width:6px;background:var(--c)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c)}
.legend b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px}
.rows{display:flex;flex-direction:column;gap:4px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:8px;border:0;border-radius:16px;background:transparent;text-align:left;cursor:pointer;transition:background .2s}
.row:hover{background:var(--fill-1)}
.row .th{width:52px;height:52px;border-radius:12px;object-fit:cover;flex:none;border:1px solid var(--line)}
.row .tx{min-width:0;flex:1}
.row .tt{font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .mt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:3px}
.vrow{display:flex;align-items:center;gap:12px;padding:8px;border-radius:16px}
.vrow .tx{min-width:0;flex:1}
.vrow .tt{font-weight:500;line-height:1.3}
.vrow .sb{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Keluhan: daftar + detail */
.split{display:grid;grid-template-columns:minmax(290px,350px) minmax(0,1fr);gap:18px;height:100%;padding-bottom:4px}
.pane{min-width:0;min-height:0;position:relative}
.chipbtn.back{display:none;margin-bottom:0;align-self:flex-start}
.filters{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input,.sel{width:100%;border:1px solid var(--line);background:var(--fill-1);border-radius:14px;padding:9px 12px 9px 36px;outline:none}
.search input::placeholder{color:var(--ink-3)}
.search input:focus,.sel:focus,.fld:focus{border-color:#8cc0ff}
.sel{padding:9px 12px;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#cfc7bb 50%),linear-gradient(135deg,#cfc7bb 50%,transparent 50%);background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.sel option{background:#2b2119;color:#f6f0e7}
.selrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;color:var(--ink-2);padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:500;cursor:pointer;transition:background .2s,color .2s}
.chipbtn:hover{background:var(--fill-1);color:var(--ink)}
.chipbtn[aria-pressed=true]{background:var(--fill-2);color:var(--ink);border-color:var(--line-2)}
.chipbtn em{font-style:normal;color:var(--ink-3);font-variant-numeric:tabular-nums}
.item{display:flex;gap:12px;align-items:flex-start;width:100%;padding:10px;border:1px solid transparent;border-radius:18px;background:transparent;text-align:left;cursor:pointer;transition:background .2s}
.item:hover{background:var(--fill-1)}
.item[aria-current=true]{background:var(--fill-2);border-color:var(--line-2)}
.item .th{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none;border:1px solid var(--line)}
.item .bd{min-width:0;flex:1}
.item .tp{display:flex;gap:8px;align-items:center;font-size:12px}
.item .ti{font-weight:500;line-height:1.3;margin:2px 0 6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .ft{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.empty{padding:28px 12px;text-align:center;color:var(--ink-2)}

/* Detail */
.d-head .cat{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.d-head h2{font-family:var(--font-display);font-weight:400;font-size:30px;line-height:1.12;margin:4px 0 6px;text-wrap:balance}
.d-head .loc{display:flex;gap:6px;align-items:flex-start;color:var(--ink-2);font-size:13px}
.d-head .loc svg{margin-top:2px}
.pills{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px}
.metrics .card{padding:12px 14px}
.metrics .lab{font-size:12px;color:var(--ink-2)}
.metrics .val{font-family:var(--font-display);font-size:26px;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums}
.metrics .nt{font-size:11.5px;color:var(--ink-3)}
.metrics .warn .val{color:#ffb86b}
.gal{display:grid;gap:8px}
.gal.n3{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}
.gal.n3 img:first-child{grid-row:span 2}
.gal.n2{grid-template-columns:1fr 1fr}
.gal.n1{grid-template-columns:1fr}
.gal img,.ph{width:100%;height:100%;min-height:90px;aspect-ratio:4/3;object-fit:cover;border-radius:16px;border:1px solid var(--line);cursor:zoom-in;display:block}
.gal.n3 img:first-child{aspect-ratio:auto}
.cap{margin-top:8px;font-size:12px;color:var(--ink-3)}
.quote{color:var(--ink);line-height:1.55}
.quote small{display:block;margin-top:6px;color:var(--ink-3);font-size:12px}
.ai{border-radius:20px;border:1px solid var(--line-2);background:linear-gradient(180deg,rgba(51,140,237,.14),rgba(51,140,237,.04));padding:16px}
.ai .sum{line-height:1.55}
.ai .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:14px}
.kv{padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.2)}
.kv .k{font-size:11.5px;color:var(--ink-3)}
.kv .v{font-weight:500;line-height:1.35;margin-top:1px}
.meter{height:7px;border-radius:4px;background:rgba(255,248,238,.14);overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px;background:var(--mc,var(--blue))}
.src{display:flex;flex-direction:column;margin-top:14px;border-top:1px solid var(--line)}
.src .s{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.src .s:last-child{border-bottom:0;padding-bottom:0}
.src .s>svg{margin-top:2px;color:var(--ink-2)}
.src .sl{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.src .sv{margin-top:1px;line-height:1.45}
.src ul{list-style:none;padding:0;margin:4px 0 0;display:flex;flex-direction:column;gap:6px}
.src li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.disc{margin-top:12px;font-size:12px;color:var(--ink-3)}
.vol{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.vol .who{display:flex;gap:12px;align-items:center;min-width:0;flex:1 1 220px}
.vol .nm{font-weight:600}
.vol .sb{font-size:12.5px;color:var(--ink-2)}
.stg{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:2px}
.stg li{display:flex;gap:12px;align-items:flex-start;padding:8px 6px;border-radius:12px}
.stg input{appearance:none;-webkit-appearance:none;flex:none;width:20px;height:20px;margin:1px 0 0;border-radius:7px;border:1.5px solid var(--line-2);background:transparent;display:grid;place-items:center;cursor:pointer}
.stg input:checked{background:var(--green);border-color:var(--green)}
.stg input:checked::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.stg input:disabled{cursor:not-allowed;opacity:.8}
.stg label{flex:1;line-height:1.4;cursor:pointer}
.stg li.dn label{color:var(--ink-2);text-decoration:line-through;text-decoration-color:rgba(246,240,231,.35)}
.stg .tag{flex:none}
.prog{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.prog .meter{flex:1}
.note{font-size:12.5px;color:var(--ink-3);margin-top:8px}
.reps{display:flex;flex-direction:column;gap:12px}
.rep{display:flex;gap:12px}
.rep .bd{flex:1;min-width:0}
.rep .hd{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.rep .hd b{color:var(--ink);font-weight:600}
.rep p{margin-top:2px;line-height:1.5}
.rep img{width:140px;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;margin-top:8px;border:1px solid var(--line);cursor:zoom-in;display:block}
.form{position:relative;margin-top:14px;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;background:var(--fill-1);border:1px solid var(--line)}
.fld{width:100%;min-height:76px;resize:vertical;border:1px solid var(--line);background:rgba(0,0,0,.18);border-radius:14px;padding:10px 12px;outline:none}
.fld::placeholder{color:var(--ink-3)}
.frow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.frow .prev{display:flex;align-items:center;gap:8px}
.frow .prev img{width:44px;height:44px;border-radius:10px;object-fit:cover}
.msg{font-size:12.5px;color:#ffb0b0}
.tl{list-style:none;margin:0;padding:0 0 0 4px;display:flex;flex-direction:column}
.tl li{position:relative;padding:0 0 14px 22px;font-size:13px}

var rainStart=(function(){var d=new Date(NOW);d.setHours(Math.floor(d.getHours()/6)*6,0,0,0);return d.getTime()})();
function mono(p){var n=p.length,dx=[],m=[],t=[],i;
  for(i=0;i<n-1;i++){dx[i]=p[i+1][0]-p[i][0];m[i]=(p[i+1][1]-p[i][1])/dx[i]}
  t[0]=m[0];t[n-1]=m[n-2];
  for(i=1;i<n-1;i++)t[i]=m[i-1]*m[i]<=0?0:(m[i-1]+m[i])/2;
  for(i=0;i<n-1;i++){if(m[i]===0){t[i]=t[i+1]=0}else{var a=t[i]/m[i],b=t[i+1]/m[i],s=a*a+b*b;if(s>9){var k=3/Math.sqrt(s);t[i]=k*a*m[i];t[i+1]=k*b*m[i]}}}
  var d='M'+p[0][0]+','+p[0][1];
  for(i=0;i<n-1;i++){var h=dx[i]/3;d+='C'+(p[i][0]+h)+','+(p[i][1]+t[i]*h)+' '+(p[i+1][0]-h)+','+(p[i+1][1]-t[i+1]*h)+' '+p[i+1][0]+','+p[i+1][1]}
  return d}
function dayBins(n){var b=new Date(NOW);b.setHours(0,0,0,0);var b0=b.getTime(),out=[];
  for(var i=0;i<n;i++){var s=b0-(n-1-i)*D;out.push({s:s,c:C.filter(function(k){return k.t0>=s&&k.t0<s+D}).length})}return out}
function colChart(bins){
  var W=276,top=12,bot=100,n=bins.length,slot=W/n,bw=Math.min(18,slot-8),r=4,max=Math.max(3,Math.max.apply(null,bins.map(function(b){return b.c})));
  var s='<svg class="chart" viewBox="0 0 '+W+' 124" role="img" aria-label="Keluhan masuk per hari, '+n+' hari terakhir"><defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="5" fill="rgba(255,255,255,.22)"/><rect width="2" height="5" fill="#fff"/></pattern></defs>';
  bins.forEach(function(b,i){var x=i*slot+(slot-bw)/2,h=b.c?(bot-top)*b.c/max:3,y=bot-h,d=new Date(b.s),last=i===n-1;
    var tip=WD[d.getDay()]+', '+d.getDate()+' '+MO[d.getMonth()]+' · '+b.c+' keluhan'+(last?' (hari ini)':'');
    var mark=b.c?'<path class="bar" d="M'+x+','+bot+'V'+(y+r)+'a'+r+','+r+' 0 0 1 '+r+','+(-r)+'h'+(bw-2*r)+'a'+r+','+r+' 0 0 1 '+r+','+r+'V'+bot+'Z" fill="'+(last?'url(#hatch)':'#fff')+'"/>':'<rect class="bar" x="'+x+'" y="'+(bot-3)+'" width="'+bw+'" height="3" rx="1.5" fill="#fff" opacity=".4"/>';
    s+='<g class="bg" tabindex="0" data-tip="'+esc(tip)+'" aria-label="'+esc(tip)+'"><rect x="'+(i*slot)+'" y="0" width="'+slot+'" height="'+(bot+2)+'" fill="transparent"/>'+mark+'</g>';
    s+='<text x="'+(i*slot+slot/2)+'" y="118" text-anchor="middle" font-size="10" fill="rgba(255,255,255,.85)">'+['M','S','S','R','K','J','S'][d.getDay()]+'</text>'});
  return s+'</svg>'}
function areaChart(){
  var W=276,Hh=124,pl=2,pr=8,pt=14,pb=24,n=RAIN.length,max=50,bw=W-pl-pr,bh=Hh-pt-pb;
  var X=function(i){return pl+i*bw/(n-1)},Y=function(v){return pt+bh-bh*v/max};
  var pts=RAIN.map(function(v,i){return [X(i),Y(v)]}),line=mono(pts);
  var area=line+'L'+X(n-1)+','+(pt+bh)+'L'+X(0)+','+(pt+bh)+'Z';
  var s='<svg class="chart" id="rainsvg" viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="Prakiraan curah hujan 72 jam dalam milimeter per 6 jam">';
  [0,25,50].forEach(function(g){s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(g)+'" y2="'+Y(g)+'" stroke="rgba(255,248,238,.16)" stroke-width="1"/>'});
  s+='<text x="'+(pl+2)+'" y="'+(Y(50)-3)+'" font-size="9.5" fill="rgba(246,240,231,.72)">50 mm</text><text x="'+(pl+2)+'" y="'+(Y(25)-3)+'" font-size="9.5" fill="rgba(246,240,231,.72)">25 mm</text>';
  s+='<path d="'+area+'" fill="#f6f0e7" opacity=".1"/><path d="'+line+'" fill="none" stroke="#f6f0e7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
  [[0,'start'],[5,'middle'],[11,'end']].forEach(function(a){var t=rainStart+a[0]*6*H,d=new Date(t);s+='<text x="'+X(a[0])+'" y="'+(Hh-6)+'" text-anchor="'+a[1]+'" font-size="10" fill="rgba(246,240,231,.78)">'+WD[d.getDay()]+' '+p2(d.getHours())+'</text>'});
  s+='<g id="xh" hidden><line id="xhl" y1="'+pt+'" y2="'+(pt+bh)+'" stroke="rgba(246,240,231,.5)" stroke-width="1"/><circle id="xhc" r="4" fill="#f6f0e7" stroke="#1e1712" stroke-width="2"/></g>';
  s+='<circle id="xend" cx="'+X(n-1)+'" cy="'+Y(RAIN[n-1])+'" r="4" fill="#f6f0e7" stroke="#1e1712" stroke-width="2"/>';
  s+='<rect id="xhit" x="0" y="0" width="'+W+'" height="'+Hh+'" fill="transparent"/></svg>';
  return {svg:s,X:X,Y:Y,W:W,Hh:Hh}}
var AREA=null;
function bindArea(){var svg=$('#rainsvg');if(!svg||!AREA)return;
  function mv(e){var r=svg.getBoundingClientRect(),x=(e.clientX-r.left)*AREA.W/r.width;
    var best=0,bd=1e9;for(var i=0;i<RAIN.length;i++){var dd=Math.abs(AREA.X(i)-x);if(dd<bd){bd=dd;best=i}}
    var g=$('#xh');g.removeAttribute('hidden');var cx=AREA.X(best),cy=AREA.Y(RAIN[best]);
    $('#xhl').setAttribute('x1',cx);$('#xhl').setAttribute('x2',cx);$('#xhc').setAttribute('cx',cx);$('#xhc').setAttribute('cy',cy);
    $('#xend').style.opacity=best===RAIN.length-1?1:.35;
    var t0=rainStart+best*6*H,d=new Date(t0);showTip(WD[d.getDay()]+' '+p2(d.getHours())+'.00 sampai '+p2((d.getHours()+6)%24)+'.00 · '+RAIN[best]+' mm',e.clientX,e.clientY)}
  function lv(){$('#xh').setAttribute('hidden','');$('#xend').style.opacity=1;hideTip()}
  svg.addEventListener('pointermove',mv);svg.addEventListener('pointerdown',mv);svg.addEventListener('pointerleave',lv)}

/* ---------- Tooltip ---------- */
var tip=$('#tip');
function showTip(t,x,y){tip.textContent=t;tip.hidden=false;var w=tip.offsetWidth,h=tip.offsetHeight,vw=window.innerWidth;
  var left=Math.min(Math.max(8,x+14),vw-w-8),top=y-h-12<8?y+18:y-h-12;tip.style.left=left+'px';tip.style.top=top+'px'}
function hideTip(){tip.hidden=true}
document.addEventListener('pointermove',function(e){var t=e.target.closest&&e.target.closest('[data-tip]');if(t)showTip(t.getAttribute('data-tip'),e.clientX,e.clientY);else if(!e.target.closest||!e.target.closest('#rainsvg'))hideTip()});
document.addEventListener('focusin',function(e){var t=e.target.closest&&e.target.closest('[data-tip]');if(t){var r=t.getBoundingClientRect();showTip(t.getAttribute('data-tip'),r.left+r.width/2,r.top)}});
document.addEventListener('focusout',hideTip);

/* ---------- Widget kanan ---------- */
var BMKG_UNTIL=(function(){var d=new Date(NOW+54*H);d.setMinutes(0,0,0);return d.getTime()})();
function renderRail(){
  var bins=dayBins(11),last7=C.filter(function(k){return NOW-k.t0<=7*D}).length,prev7=C.filter(function(k){var a=NOW-k.t0;return a>7*D&&a<=14*D}).length;
  var diff=last7-prev7,total=RAIN.reduce(function(a,b){return a+b},0),pk=RAIN.indexOf(Math.max.apply(null,RAIN)),pd=new Date(rainStart+pk*6*H);
  AREA=areaChart();
  var tbl1='<table class="sr"><caption>Keluhan masuk per hari</caption><tr><th>Tanggal</th><th>Keluhan</th></tr>'+bins.map(function(b){var d=new Date(b.s);return '<tr><td>'+d.getDate()+' '+MO[d.getMonth()]+'</td><td>'+b.c+'</td></tr>'}).join('')+'</table>';
  var tbl2='<table class="sr"><caption>Prakiraan hujan per 6 jam</caption><tr><th>Mulai</th><th>mm</th></tr>'+RAIN.map(function(v,i){return '<tr><td>'+fmtDT(rainStart+i*6*H)+'</td><td>'+v+'</td></tr>'}).join('')+'</table>';
  $('#rail').innerHTML=
   '<article class="w w-blue"><h3>'+ico('msg',16)+'Keluhan masuk<span class="gl">'+ico('grid',16)+'</span></h3><div class="big">'+C.length+'</div><p class="sub">'+last7+' baru dalam 7 hari <span class="chip">'+(diff>=0?'+':'')+diff+' dari minggu lalu</span></p>'+colChart(bins)+tbl1+'</article>'+
   '<article class="w w-sand"><h3>'+ico('shield',16)+'Peringatan BMKG<span class="tag">contoh</span></h3><div class="big" style="padding-right:48px">Hujan lebat</div><p class="sub" style="padding-right:52px">Berlaku sampai '+fmtDT(BMKG_UNTIL)+'. '+open().filter(function(k){return k.ai.bmkg}).length+' tugas terbuka terpengaruh.</p><button class="round-btn" type="button" data-act="nav" data-v="analisis" aria-label="Buka Analisis AI">'+ico('arrow',18)+'</button></article>'+
   '<article class="w w-dark"><h3>'+ico('rain',16)+'Prakiraan hujan 72 jam<span class="tag">contoh</span></h3><div class="big">'+total+' <span style="font-size:20px;color:var(--ink-2)">mm</span></div><p class="sub">Puncak '+RAIN[pk]+' mm per 6 jam, '+WD[pd.getDay()]+' '+p2(pd.getHours())+'.00</p>'+AREA.svg+tbl2+'</article>';
  bindArea()}

   run=C.filter(function(k){return k.st==='diambil'||k.st==='dikerjakan'}),dn=C.filter(function(k){return k.st==='selesai'}),
   wait=avg(C.filter(function(k){return k.tc}).map(function(k){return k.tc-k.t0})),

   '<div class="two"><section><h2 class="sec">Perlu perhatian<span class="tag">umur tugas</span></h2><div class="rows">'+att.map(rowItem).join('')+'</div></section>'+
   '<section><h2 class="sec">Relawan bertugas<span class="tag">lama diambil</span></h2><div class="rows">'+(vr||'<div class="empty">Belum ada relawan yang mengambil tugas.</div>')+'</div></section></div></div>'}

  var gal='<div class="gal n'+k.foto.length+'">'+k.foto.map(function(f,i){return '<img src="'+photo(f[0],f[1])+'" alt="Foto keluhan '+(i+1)+'" data-lb="'+esc(capOf(k,i))+'">'}).join('')+'</div><p class="cap">Foto contoh (ilustrasi). Foto asli dari warga akan tampil di sini. Ketuk foto untuk memperbesar.</p>';
  var relBox;
  if(k.by){var v=VOL[k.by];relBox='<div class="card vol"><div class="who">'+av(k.by,44)+'<div style="min-width:0"><div class="nm">'+esc(v.n)+'</div><div class="sb">@'+v.u+' · '+v.w+'</div></div></div><div><div class="sb">'+(done?'Lama dikerjakan':'Lama diambil')+'</div><div class="num" style="font-size:24px"><span data-since="'+k.tc+'"'+(k.td?' data-until="'+k.td+'"':'')+'>'+dur((k.td||Date.now())-k.tc)+'</span></div></div></div>'}
  else relBox='<div class="card vol"><div class="who"><span class="av" style="--h:40;width:44px;height:44px;background:var(--fill-2)">'+ico('users',20)+'</span><div><div class="nm">Belum ada relawan</div><div class="sb">Sudah menunggu <span data-since="'+k.t0+'">'+dur(Date.now()-k.t0)+'</span></div></div></div><button class="pill-btn" type="button" data-act="claim" data-id="'+k.id+'">'+ico('hand',16)+'Ambil tugas ini</button></div>';
  var stages='<ul class="stg">'+k.tahap.map(function(t,i){var id='stg-'+k.id+'-'+i;return '<li class="'+(t.d?'dn':'')+'"><input type="checkbox" id="'+id+'" data-act="stage" data-id="'+k.id+'" data-i="'+i+'"'+(t.d?' checked':'')+(mine&&!done?'':' disabled')+'><label for="'+id+'">'+esc(t.t)+'</label><span class="tag" title="Tahap disarankan AI. Boleh diikuti, diubah, atau dilewati.">AI</span></li>'}).join('')+'</ul>';
  var form='';
  if(mine&&!done){form='<div class="form"><label class="sr" for="rpt-text">Catatan progres</label><textarea class="fld" id="rpt-text" placeholder="Catatan progres (opsional). Tulis apa yang sudah dikerjakan atau kendalanya.">'+esc(S.draft[k.id]||'')+'</textarea><div class="frow"><input type="file" id="rpt-file" accept="image/*" class="sr"><label for="rpt-file" class="pill-btn ghost sm" style="cursor:pointer">'+ico('camera',16)+'Lampirkan foto</label><span class="prev" id="rpt-prev">'+(S.shot[k.id]?'<img src="'+S.shot[k.id]+'" alt="Foto terlampir"><button type="button" class="chipbtn" data-act="rmshot">Hapus</button>':'')+'</span><button type="button" class="pill-btn sm" data-act="report" data-id="'+k.id+'" style="margin-left:auto">'+ico('send',15)+'Kirim laporan</button></div><div class="msg" id="rpt-msg" role="status"></div><div class="note" style="margin-top:0">Catatan dan foto ini opsional. Isi sesuai kebutuhan.</div></div>'}
  else if(!k.by)form='<p class="note">Ambil tugas dulu untuk mengisi tahapan dan laporan progres.</p>';
  else if(!mine&&!done)form='<p class="note">Hanya relawan yang mengambil tugas ini yang bisa mengisi tahapan dan laporan.</p>';
  var finish=(mine&&!done)?'<div style="margin-top:14px"><button class="pill-btn sm" type="button" data-act="finish" data-id="'+k.id+'">'+ico('done',16)+'Tandai tugas selesai</button></div>':'';
  return '<article class="stack" style="padding-bottom:12px"><button type="button" class="chipbtn back" data-act="back">'+ico('left',14)+'Kembali ke daftar</button>'+
   '<header class="d-head"><div class="cat"><span class="code">'+k.id+'</span><span>·</span><span>'+k.kat+'</span></div><h2>'+esc(k.judul)+'</h2><div class="loc">'+ico('pin',15)+'<span>'+esc(k.lok)+', '+k.kel+'</span></div><div class="pills">'+stPill(k)+lvPill(k)+ageChip(k)+(ageSev(k)==='sev-hi'?'<span class="age sev-hi">Lewat 7 hari</span>':'')+'</div></header>'+
   '<section><h3 class="sec">Waktu tugas</h3><div class="metrics">'+m1+m2+m3+'</div></section>'+
   '<section><h3 class="sec">'+ico('image',14)+'Foto keluhan</h3>'+gal+'</section>'+
   '<section><h3 class="sec">Laporan warga</h3><p class="quote">'+esc(k.desk)+'<small>Dilaporkan oleh '+esc(k.pel)+' · '+fmtDT(k.t0)+'</small></p></section>'+
   '<section class="ai"><h3 class="sec" style="color:#8cc0ff">'+ico('spark',14)+'Analisis AI<span class="tag">keyakinan '+k.ai.yakin+'%</span></h3><p class="sum">'+esc(k.ai.ring)+'</p>'+
   '<div class="grid"><div class="kv"><div class="k">Prioritas</div><div class="v">'+l.l+' · '+k.skor+'/100</div><div class="meter" style="margin-top:8px;--mc:'+(l.k==='kritis'?'var(--red)':l.k==='tinggi'?'var(--orange)':'var(--blue)')+'"><i style="width:'+k.skor+'%"></i></div></div><div class="kv"><div class="k">Perkiraan waktu kerja</div><div class="v">'+esc(k.ai.est)+'</div></div><div class="kv" style="grid-column:1/-1"><div class="k">Saran tindakan</div><div class="v">'+esc(k.ai.rek)+'</div></div></div>'+
   '<h4 class="sec" style="margin:18px 0 0">Dasar analisis</h4><div class="src">'+srcRows(k)+'</div><p class="disc">Dibuat AI dari data contoh. Periksa kembali di lapangan sebelum bertindak.</p></section>'+
   '<section><h3 class="sec">'+ico('users',14)+'Relawan</h3>'+relBox+'</section>'+
   '<section><h3 class="sec">Tahapan<span class="tag">disarankan AI · opsional</span></h3><div class="prog"><div class="meter" style="--mc:var(--green)"><i style="width:'+pct+'%"></i></div><span>'+doneN+' dari '+k.tahap.length+' tahap</span></div>'+stages+finish+'</section>'+
   '<section><h3 class="sec">Laporan dan bukti progres<span class="tag">opsional</span></h3>'+repHTML(k)+form+'</section>'+
   '<section><h3 class="sec">Linimasa</h3>'+tlHTML(k)+'</section></article>'}
function renderDetail(){var el=$('#det');if(!el)return;var k=byId(S.sel);
  if(!k){el.innerHTML='<div class="empty" style="padding-top:60px">Pilih satu keluhan di daftar untuk melihat foto, analisis AI, relawan, dan progresnya.</div>';return}
  var sc=el.scrollTop;el.innerHTML=detailHTML(k);el.scrollTop=sc;$('#split').classList.toggle('has-sel',true)}

/* ---------- Tampilan: Relawan ---------- */
function vRelawan(){
  var ids=Object.keys(VOL).filter(function(id){return C.some(function(k){return k.by===id})});
  var cards=ids.map(function(id){var v=VOL[id],mine=C.filter(function(k){return k.by===id}),act=mine.filter(function(k){return k.st!=='selesai'}),dn=mine.filter(function(k){return k.st==='selesai'}),a=avg(dn.map(function(k){return k.td-k.tc}));
    return '<div class="card vcard"><div class="top">'+av(id,44)+'<div><div class="nm">'+esc(v.n)+'</div><div class="sb">@'+v.u+' · '+v.w+'</div></div></div><div class="st"><div><b>'+act.length+'</b><span>tugas aktif</span></div><div><b>'+dn.length+'</b><span>selesai</span></div></div><div class="sb">'+(a!=null?'Rata-rata dikerjakan '+dur(a):'Belum ada tugas selesai')+'</div></div>'}).join('');
  var rows=C.filter(function(k){return k.by}).sort(function(a,b){return b.tc-a.tc}).map(function(k){var v=VOL[k.by],n=k.tahap.filter(function(t){return t.d}).length,pct=Math.round(n/k.tahap.length*100);
    return '<tr><td><div class="who2">'+av(k.by,28)+'<span>'+esc(v.n)+'</span></div></td><td><button type="button" class="lk" data-act="open" data-id="'+k.id+'"><span class="code">'+k.id+'</span><br>'+esc(k.judul)+'</button></td><td>'+fmtDT(k.tc)+'</td><td class="age" style="display:table-cell"><span data-since="'+k.tc+'"'+(k.td?' data-until="'+k.td+'"':'')+'>'+dur((k.td||Date.now())-k.tc)+'</span></td><td><div class="prog" style="min-width:120px"><div class="meter" style="--mc:var(--green)"><i style="width:'+pct+'%"></i></div><span>'+n+'/'+k.tahap.length+'</span></div></td><td>'+stPill(k)+'</td></tr>'}).join('');
  return '<div class="stack"><section><h2 class="sec">Akun relawan</h2><div class="vgrid">'+cards+'</div></section><section><h2 class="sec">Tugas yang diambil</h2><div class="tblwrap"><table><thead><tr><th>Relawan</th><th>Tugas</th><th>Diambil</th><th>Lama diambil</th><th>Tahapan</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div></section></div>'}

/* ---------- Tampilan: Analisis AI ---------- */
function vAnalisis(){
  var op=open(),wx=op.filter(function(k){return k.ai.bmkg}),stale=C.filter(function(k){return k.st==='belum'&&Date.now()-k.t0>3*D}).sort(function(a,b){return a.t0-b.t0}),
   topU=C.filter(function(k){return k.st==='belum'}).sort(function(a,b){return b.skor-a.skor})[0];
  var ins=[['rain',wx.length+' tugas terbuka terpengaruh hujan lebat','Peringatan BMKG berlaku untuk '+wx.filter(function(k){return k.kat==='Jalan'||k.kat==='Jembatan'}).length+' tugas jalan dan jembatan. Kerjakan sebelum puncak hujan.'],
   ['clock',stale.length+' keluhan belum diambil lebih dari 3 hari',stale.length?'Yang tertua '+stale[0].id+' ('+esc(stale[0].kat)+'), sudah '+dur(Date.now()-stale[0].t0)+'.':'Tidak ada yang tertahan.'],
   ['alert',topU?topU.id+' paling mendesak':'Semua tugas sudah diambil',topU?esc(topU.judul)+' dengan skor '+topU.skor+'. Ambil hari ini.':'Tidak ada tugas yang menunggu.']];
  var nL=0,nB=0,nO=0;C.forEach(function(k){nL+=k.ai.lap.n;nB+=k.ai.bukti.length;nO+=k.ai.lain.length});
  var srcs=[['shield','Data BMKG',wx.length+' tugas','dari '+C.length+' keluhan punya peringatan terkait'],['rain','Data cuaca',C.length+' tugas','prakiraan hujan, angin, dan suhu'],['globe','Laporan internet',nL+' laporan','laporan serupa dari kanal publik'],['file','Bukti internet',nB+' bukti','unggahan, tiket, dan arsip'],['db','Data lain',nO+' catatan','lalu lintas, riwayat titik, kontur']];
  var cats={};C.forEach(function(k){cats[k.kat]=(cats[k.kat]||0)+1});var ca=Object.keys(cats).sort(function(a,b){return cats[b]-cats[a]}),cm=cats[ca[0]];
  var pr=op.slice().sort(function(a,b){return b.skor-a.skor}).slice(0,6).map(function(k){var l=lvl(k.skor);return '<div class="pr"><div class="tx"><button type="button" data-act="open" data-id="'+k.id+'">'+esc(k.judul)+'</button><div class="sb">'+k.id+' · '+k.kat+' · '+ST[k.st].l+'</div></div><div><div class="lvl lv-'+l.k+'" style="margin-bottom:5px">'+lvlBars(l.n)+l.l+' · '+k.skor+'</div><div class="meter" style="--mc:'+(l.k==='kritis'?'var(--red)':l.k==='tinggi'?'var(--orange)':'var(--blue)')+'"><i style="width:'+k.skor+'%"></i></div></div></div>'}).join('');
  var total=RAIN.reduce(function(a,b){return a+b},0);
  return '<div class="stack"><section><h2 class="sec">'+ico('spark',14)+'Ringkasan AI hari ini<span class="tag">contoh data</span></h2><div class="insights">'+ins.map(function(i){return '<div class="card ins">'+ico(i[0],20)+'<div><b>'+i[1]+'</b><span>'+i[2]+'</span></div></div>'}).join('')+'</div></section>'+
   '<section><h2 class="sec">Sumber data analisis</h2><div class="srcgrid">'+srcs.map(function(s){return '<div class="card"><div class="lab">'+ico(s[0],16)+s[1]+'</div><div class="val">'+s[2]+'</div><div class="nt">'+s[3]+'</div></div>'}).join('')+'</div></section>'+
   '<section><h2 class="sec">Cuaca dan BMKG<span class="tag">contoh</span></h2><div class="card"><b>Peringatan dini: hujan lebat disertai petir</b><p class="muted" style="margin-top:2px">Berlaku sampai '+fmtDT(BMKG_UNTIL)+'. Wilayah: Sukamaju dan Mekarsari.</p><div class="wx"><div class="kv"><div class="k">Hujan 72 jam</div><div class="v">'+total+' mm</div></div><div class="kv"><div class="k">Suhu</div><div class="v">24–29 °C</div></div><div class="kv"><div class="k">Angin maksimum</div><div class="v">45 km/jam</div></div><div class="kv"><div class="k">Kelembapan</div><div class="v">88%</div></div></div></div></section>'+
   '<div class="two"><section><h2 class="sec">Prioritas AI, tugas terbuka</h2><div class="rows">'+pr+'</div></section><section><h2 class="sec">Keluhan per kategori</h2>'+ca.map(function(c){return '<div class="hb" data-tip="'+c+' · '+cats[c]+' keluhan"><span class="l">'+c+'</span><span class="t"><i style="width:'+(cats[c]/cm*100)+'%"></i></span><span class="n">'+cats[c]+'</span></div>'}).join('')+'</section></div></div>'}

/* ---------- Render utama ---------- */
var META={
 ringkasan:['Ringkasan',function(){return fmtD(NOW)+' · '+C.length+' keluhan, '+cnt('belum')+' belum diambil'}],
 keluhan:['Keluhan warga',function(){return 'Foto, analisis AI, relawan, dan progres tiap laporan'}],
 relawan:['Relawan',function(){return 'Siapa mengambil tugas apa, dan sudah berapa lama'}],
 analisis:['Analisis AI',function(){return 'Berdasarkan BMKG, cuaca, laporan dan bukti internet, serta data lain'}]};
function render(){
  var m=META[S.v];$('#mt').textContent=m[0];$('#ms').textContent=m[1]();
  $('#topbtn').innerHTML=ico('flag',15)+'Tugas prioritas';
  var v=$('#view');v.className='view'+(S.v==='keluhan'?' v-split':'');
  if(S.v==='keluhan'&&!S.sel&&isWide()){var f=filtered()[0];if(f)S.sel=f.id}
  v.innerHTML=S.v==='ringkasan'?vRingkasan():S.v==='keluhan'?vKeluhan():S.v==='relawan'?vRelawan():vAnalisis();
  if(S.v==='keluhan'){renderList();renderDetail()}
  v.scrollTop=0;renderNav()}
function refresh(){renderNav();renderRail();$('#ms').textContent=META[S.v][1]();
  if(S.v==='keluhan'){renderList();renderDetail()}else{var v=$('#view'),sc=v.scrollTop;v.innerHTML=S.v==='ringkasan'?vRingkasan():S.v==='relawan'?vRelawan():vAnalisis();v.scrollTop=sc}}

/* ---------- Aksi ---------- */
function go(v){S.v=v;if(v==='keluhan'&&!isWide())S.sel=null;render();document.scrollingElement.scrollTop=0}
function openItem(id){S.v='keluhan';S.sel=id;S.f='semua';S.q='';S.cat='semua';render()}
document.addEventListener('click',function(e){
  var img=e.target.closest&&e.target.closest('[data-lb]');if(img){lbOpen(img.src,img.getAttribute('data-lb'));return}
  var t=e.target.closest&&e.target.closest('[data-act]');if(!t)return;var a=t.dataset.act,id=t.dataset.id,k=id&&byId(id);
  if(a==='nav'){go(t.dataset.v)}
  else if(a==='open'){openItem(id)}
  else if(a==='pick'){S.sel=id;renderList();renderDetail();var d=$('#det');if(d)d.scrollTop=0;document.scrollingElement.scrollTop=0}
  else if(a==='back'){S.sel=null;$('#split').classList.remove('has-sel');renderList()}
  else if(a==='filter'){S.f=t.dataset.f;renderList()}
  else if(a==='top'){var u=C.filter(function(x){return x.st==='belum'}).sort(function(x,y){return y.skor-x.skor})[0]||open().sort(function(x,y){return y.skor-x.skor})[0];if(u)openItem(u.id)}
  else if(a==='claim'&&k){k.by='me';k.tc=Date.now();k.st='diambil';refresh()}
  else if(a==='finish'&&k){k.st='selesai';k.td=Date.now();refresh()}
  else if(a==='report'&&k){var text=(S.draft[id]||'').trim(),shot=S.shot[id];
    if(!text&&!shot){$('#rpt-msg').textContent='Isi catatan atau lampirkan foto dulu.';return}
    k.rep.push({t:Date.now(),by:'me',text:text,f:null,img:shot||null});delete S.draft[id];delete S.shot[id];renderDetail()}
  else if(a==='rmshot'){var cur=S.sel;delete S.shot[cur];$('#rpt-prev').innerHTML=''}
  else if(a==='lbx'){lbClose()}
});
document.addEventListener('change',function(e){var t=e.target;
  if(t.matches&&t.matches('[data-act=stage]')){var k=byId(t.dataset.id),i=+t.dataset.i;k.tahap[i].d=t.checked;
    var any=k.tahap.some(function(x){return x.d});if(k.st==='diambil'&&any)k.st='dikerjakan';else if(k.st==='dikerjakan'&&!any)k.st='diambil';refresh()}
  else if(t.id==='cat'){S.cat=t.value;renderList()}
  else if(t.id==='sort'){S.sort=t.value;renderList()}
  else if(t.id==='rpt-file'&&t.files&&t.files[0]){S.shot[S.sel]=URL.createObjectURL(t.files[0]);$('#rpt-prev').innerHTML='<img src="'+S.shot[S.sel]+'" alt="Foto terlampir"><button type="button" class="chipbtn" data-act="rmshot">Hapus</button>';$('#rpt-msg').textContent=''}
});
document.addEventListener('input',function(e){var t=e.target;
  if(t.id==='q'){S.q=t.value;renderList()}
  else if(t.id==='rpt-text'){S.draft[S.sel]=t.value;var m=$('#rpt-msg');if(m)m.textContent=''}
});

/* ---------- Lightbox ---------- */
var lb=$('#lb');
function lbOpen(src,cap){$('#lbimg').src=src;$('#lbcap').textContent=cap;lb.hidden=false;$('#lbx').focus()}
function lbClose(){lb.hidden=true;$('#lbimg').removeAttribute('src')}
lb.addEventListener('click',function(e){if(e.target===lb)lbClose()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!lb.hidden)lbClose()});
$('#lbx').innerHTML=ico('x',18);

/* ---------- Penghitung waktu ---------- */
function tick(){$$('[data-since]').forEach(function(el){var s=+el.dataset.since,u=el.dataset.until?+el.dataset.until:Date.now();el.textContent=dur(u-s)})}
setInterval(tick,30000);
var rz;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(function(){if(S.v==='keluhan'&&!S.sel&&isWide()){render()}},150)});

render();renderRail();
})();
</script>

</body></html>
